<!DOCTYPE html>
<html>
<head>
    <title>Google Auth Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { margin: 5px; padding: 10px; }
        pre { background: #f8f9fa; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Google Auth Test</h1>
    
    <div class="test">
        <h3>1. Test Supabase Connection</h3>
        <button onclick="testConnection()">Test Connection</button>
        <div id="connection-result"></div>
    </div>
    
    <div class="test">
        <h3>2. Test Google Auth Provider</h3>
        <button onclick="testGoogleProvider()">Test Google Provider</button>
        <div id="provider-result"></div>
    </div>
    
    <div class="test">
        <h3>3. Try Google Sign In</h3>
        <button onclick="tryGoogleSignIn()">Sign In with Google</button>
        <div id="signin-result"></div>
    </div>

    <script>
        // Initialize Supabase
        const supabaseUrl = 'https://scijpejtvneuqbhkoxuz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjaWpwZWp0dm5ldXFiaGtveHV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU1OTcxNDEsImV4cCI6MjA3MTE3MzE0MX0.Z6Q_DmsuHYOOvCGed5hcKDrT93XPL5hHwCyGDREcmmw';
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        async function testConnection() {
            const result = document.getElementById('connection-result');
            try {
                const { data, error } = await supabase.auth.getSession();
                if (error) {
                    result.innerHTML = `<div class="error">Connection Error: ${error.message}</div>`;
                } else {
                    result.innerHTML = `<div class="success">✅ Connected to Supabase successfully</div>`;
                }
            } catch (error) {
                result.innerHTML = `<div class="error">Network Error: ${error.message}</div>`;
            }
        }
        
        async function testGoogleProvider() {
            const result = document.getElementById('provider-result');
            try {
                // Try to get the auth configuration
                const response = await fetch(`${supabaseUrl}/auth/v1/settings`, {
                    headers: {
                        'apikey': supabaseKey,
                        'Authorization': `Bearer ${supabaseKey}`
                    }
                });
                
                if (response.ok) {
                    const settings = await response.json();
                    const googleEnabled = settings.external?.google?.enabled;
                    
                    result.innerHTML = `
                        <div class="${googleEnabled ? 'success' : 'error'}">
                            Google Provider Enabled: ${googleEnabled ? '✅ Yes' : '❌ No'}
                        </div>
                        <pre>${JSON.stringify(settings.external, null, 2)}</pre>
                    `;
                } else {
                    result.innerHTML = `<div class="error">Failed to get auth settings: ${response.status}</div>`;
                }
            } catch (error) {
                result.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
        
        async function tryGoogleSignIn() {
            const result = document.getElementById('signin-result');
            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: `${window.location.origin}/auth/callback`
                    }
                });
                
                if (error) {
                    result.innerHTML = `<div class="error">❌ Error: ${error.message}</div>`;
                } else {
                    result.innerHTML = `<div class="success">✅ Redirecting to Google...</div>`;
                }
            } catch (error) {
                result.innerHTML = `<div class="error">Network Error: ${error.message}</div>`;
            }
        }
        
        // Auto-test connection on load
        window.onload = () => {
            testConnection();
        };
    </script>
</body>
</html>
