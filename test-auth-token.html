<!DOCTYPE html>
<html>
<head>
    <title>Auth Token Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .token { background: #f5f5f5; padding: 10px; border-radius: 4px; word-break: break-all; }
    </style>
</head>
<body>
    <h1>Authentication Token Test</h1>
    <div id="results"></div>

    <script type="module">
        import { createClient } from 'https://cdn.skypack.dev/@supabase/supabase-js@2';

        const supabaseUrl = 'https://scijpejtvneuqbhkoxuz.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjaWpwZWp0dm5ldXFiaGtveHV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU1OTcxNDEsImV4cCI6MjA3MTE3MzE0MX0.Z6Q_DmsuHYOOvCGed5hcKDrT93XPL5hHwCyGDREcmmw';
        
        const supabase = createClient(supabaseUrl, supabaseKey);

        async function testAuth() {
            const results = document.getElementById('results');
            
            function addResult(test, status, message) {
                const div = document.createElement('div');
                div.className = 'test';
                div.innerHTML = `
                    <strong>${test}:</strong> 
                    <span class="${status}">${status.toUpperCase()}</span> - ${message}
                `;
                results.appendChild(div);
            }

            // Test 1: Check current session
            try {
                const { data: { session }, error } = await supabase.auth.getSession();
                
                if (error) {
                    addResult('Session Check', 'error', `Session error: ${error.message}`);
                } else if (session) {
                    addResult('Session Check', 'success', `Session found for user: ${session.user.email}`);
                    
                    // Show token info
                    const tokenDiv = document.createElement('div');
                    tokenDiv.className = 'test';
                    tokenDiv.innerHTML = `
                        <strong>Access Token:</strong><br>
                        <div class="token">${session.access_token.substring(0, 50)}...</div>
                        <small>Expires: ${new Date(session.expires_at * 1000).toLocaleString()}</small>
                    `;
                    results.appendChild(tokenDiv);
                    
                    // Test API call with token
                    await testApiCall(session.access_token);
                } else {
                    addResult('Session Check', 'error', 'No active session found. Please log in first.');
                }
            } catch (error) {
                addResult('Session Check', 'error', `Session check failed: ${error.message}`);
            }
        }

        async function testApiCall(token) {
            const results = document.getElementById('results');
            
            function addResult(test, status, message) {
                const div = document.createElement('div');
                div.className = 'test';
                div.innerHTML = `
                    <strong>${test}:</strong> 
                    <span class="${status}">${status.toUpperCase()}</span> - ${message}
                `;
                results.appendChild(div);
            }

            try {
                addResult('API Call Test', 'info', 'Testing API call with Supabase token...');
                
                const response = await fetch('http://localhost:8000/api/subjects', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addResult('API Call Test', 'success', `API call successful! Got ${data.length || 0} subjects`);
                } else {
                    const errorText = await response.text();
                    addResult('API Call Test', 'error', `API call failed (${response.status}): ${errorText}`);
                }
            } catch (error) {
                addResult('API Call Test', 'error', `API call error: ${error.message}`);
            }
        }

        // Run test when page loads
        testAuth();
    </script>
</body>
</html>
