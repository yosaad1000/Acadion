version: '3.8'

services:
  acadion-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: acadion-backend
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_ENVIRONMENT=${PINECONE_ENVIRONMENT:-us-east-1}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}
      - FACE_THRESHOLD=${FACE_THRESHOLD:-0.6}
      - REDIS_URL=redis://acadion-redis:6379
      - ENVIRONMENT=production
    depends_on:
      - acadion-redis
    volumes:
      - ./backend/logs:/app/logs
    networks:
      - acadion-network
    restart: unless-stopped

  acadion-redis:
    image: redis:7-alpine
    container_name: acadion-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - acadion-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: acadion-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/ssl:ro
    depends_on:
      - acadion-backend
    networks:
      - acadion-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  acadion-network:
    driver: bridge