# SonarQube Configuration for Acadion Platform

# Project identification
sonar.projectKey=acadion-platform
sonar.organization=acadion
sonar.projectName=Acadion AI Student Management Platform
sonar.projectVersion=2.0.0

# Source code configuration
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src/test

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/migrations/**,**/venv/**,**/.pytest_cache/**

# Language-specific settings
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Python specific
sonar.python.xunit.reportPath=backend/test-results.xml
sonar.python.pylint.reportPath=backend/pylint-report.txt

# JavaScript/TypeScript specific
sonar.typescript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.eslint.reportPaths=frontend/eslint-report.json

# Quality gate settings
sonar.qualitygate.wait=true

# Security hotspots
sonar.security.hotspots.inheritFromParent=true