<!DOCTYPE html>
<html>
<head>
    <title>Backend Connection Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Backend Connection Test</h1>
    <div id="results"></div>

    <script>
        async function testBackend() {
            const results = document.getElementById('results');
            
            function addResult(test, status, message) {
                const div = document.createElement('div');
                div.className = 'test';
                div.innerHTML = `
                    <strong>${test}:</strong> 
                    <span class="${status}">${status.toUpperCase()}</span> - ${message}
                `;
                results.appendChild(div);
            }

            // Test 1: Basic backend connectivity
            try {
                addResult('Backend Connectivity', 'info', 'Testing connection to http://localhost:8000...');
                
                const response = await fetch('http://localhost:8000/api/health', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.text();
                    addResult('Backend Health Check', 'success', `Backend is running! Response: ${data}`);
                } else {
                    addResult('Backend Health Check', 'error', `Backend responded with status: ${response.status}`);
                }
            } catch (error) {
                addResult('Backend Health Check', 'error', `Cannot connect to backend: ${error.message}`);
            }

            // Test 2: Test subjects endpoint
            try {
                addResult('Subjects API', 'info', 'Testing /api/subjects endpoint...');
                
                const response = await fetch('http://localhost:8000/api/subjects', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    addResult('Subjects API', 'success', `Subjects endpoint works! Found ${data.length || 0} subjects`);
                } else {
                    addResult('Subjects API', 'error', `Subjects endpoint failed with status: ${response.status}`);
                }
            } catch (error) {
                addResult('Subjects API', 'error', `Subjects API error: ${error.message}`);
            }

            // Test 3: CORS check
            try {
                addResult('CORS Check', 'info', 'Testing CORS configuration...');
                
                const response = await fetch('http://localhost:8000/api/subjects', {
                    method: 'OPTIONS'
                });
                
                const corsHeaders = response.headers.get('Access-Control-Allow-Origin');
                if (corsHeaders) {
                    addResult('CORS Check', 'success', `CORS is configured: ${corsHeaders}`);
                } else {
                    addResult('CORS Check', 'error', 'CORS headers not found - this might cause issues');
                }
            } catch (error) {
                addResult('CORS Check', 'error', `CORS test failed: ${error.message}`);
            }
        }

        // Run tests when page loads
        testBackend();
    </script>
</body>
</html>
