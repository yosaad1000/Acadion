[tool:pytest]
# Comprehensive testing configuration for Google Calendar integration
testpaths = tests
python_paths = .
addopts = -v --tb=short --strict-markers --disable-warnings
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers for categorization
markers =
    # Main test categories for Task 14
    e2e: End-to-end workflow tests
    integration: Google Calendar API integration tests (requires test credentials)
    performance: Performance and bulk operation tests
    security: Security and OAuth token handling tests
    validation: Data validation tests for API endpoints
    load: Load and concurrent operation tests
    requirements: Requirements validation tests
    
    # Specific test types
    api_validation: API endpoint validation tests
    security_validation: Security vulnerability tests
    response_validation: API response format validation
    rate_limiting: Rate limiting tests
    
    # Performance subcategories
    bulk_operations: Bulk operation performance tests
    concurrent: Concurrent operation tests
    memory: Memory usage and leak tests
    scalability: System scalability tests
    
    # Security subcategories
    oauth_security: OAuth flow security tests
    token_security: Token handling security tests
    input_sanitization: Input sanitization tests
    
    # Test environments
    unit: Unit tests (fast, no external dependencies)
    integration_real: Tests requiring real Google Calendar API
    mock: Tests using mocked dependencies
    
    # Test priorities
    critical: Critical functionality tests
    important: Important feature tests
    optional: Optional or edge case tests
    
    # Test speed
    fast: Fast tests (< 1 second)
    medium: Medium tests (1-10 seconds)
    slow: Slow tests (> 10 seconds)

# Minimum test coverage requirements
addopts = --cov=app --cov-report=term-missing --cov-report=html --cov-fail-under=80

# Test discovery patterns
collect_ignore = [
    "setup.py",
    "__pycache__",
    "*.pyc"
]

# Timeout settings for long-running tests
timeout = 300  # 5 minutes max per test

# Parallel execution settings (if pytest-xdist is available)
# addopts = -n auto

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:google.*
    ignore::UserWarning:httpx.*