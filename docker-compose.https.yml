version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend.https
    container_name: acadion-backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - DOCKER_ENV=true
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - ./ssl:/app/ssl:ro  # Mount SSL certificates as read-only
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  redis:
    image: redis:7-alpine
    container_name: acadion-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data: