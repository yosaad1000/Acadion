name: Deploy to Custom Domain (acadion.online)

on:
  workflow_dispatch:
    inputs:
      setup_ssl:
        description: 'Setup SSL certificates (first time only)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
  push:
    branches: [ main ]
    paths: 
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose*.yml'
      - 'setup-existing-domain.sh'
      - '.github/workflows/deploy-domain.yml'

env:
  AWS_REGION: us-east-1
  EC2_HOST: 54.167.95.26
  DOMAIN: acadion.online
  API_DOMAIN: api.acadion.online

jobs:
  setup-domain:
    runs-on: ubuntu-latest
    if: github.event.inputs.setup_ssl == 'true' || contains(github.event.head_commit.message, '[setup-ssl]')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Domain and SSL
      run: |
        echo "🚀 Setting up domain: ${{ env.DOMAIN }}"
        
        # Deploy to EC2
        echo "${{ secrets.EC2_PRIVATE_KEY }}" > key.pem
        chmod 600 key.pem
        
        # Copy setup script and execute
        scp -i key.pem -o StrictHostKeyChecking=no setup-existing-domain.sh ec2-user@${{ env.EC2_HOST }}:/tmp/
        ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} 'chmod +x /tmp/setup-existing-domain.sh && /tmp/setup-existing-domain.sh acadion.online'

  deploy-backend:
    runs-on: ubuntu-latest
    needs: [setup-domain]
    if: always() && (needs.setup-domain.result == 'success' || needs.setup-domain.result == 'skipped')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy Backend to Domain
      run: |
        echo "🚀 Deploying backend to https://api.acadion.online"
        
        # Create deployment archive
        tar -czf acadion-deploy.tar.gz \
          backend/ \
          docker-compose.backend-only.yml \
          Dockerfile.backend
        
        # Deploy to EC2
        echo "${{ secrets.EC2_PRIVATE_KEY }}" > key.pem
        chmod 600 key.pem
        
        # Copy deployment files
        scp -i key.pem -o StrictHostKeyChecking=no acadion-deploy.tar.gz ec2-user@${{ env.EC2_HOST }}:/tmp/
        
        # Execute deployment
        ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} << 'DEPLOY_SCRIPT'
        set -e
        
        echo "🚀 Starting backend deployment for domain..."
        
        # Create and navigate to project directory
        mkdir -p /home/ec2-user/acadion
        cd /home/ec2-user/acadion
        
        # Extract the uploaded code
        echo "📥 Extracting latest code..."
        tar -xzf /tmp/acadion-deploy.tar.gz
        
        # Create/update environment file
        cat > backend/.env << 'ENVEOF'
        SUPABASE_URL=${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
        SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
        SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
        PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
        PINECONE_ENVIRONMENT=${{ secrets.PINECONE_ENVIRONMENT }}
        PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}
        FACE_THRESHOLD=0.6
        REDIS_URL=redis://redis:6379
        AWS_DEFAULT_REGION=us-east-1
        AWS_REGION=us-east-1
        ENVEOF
        
        # Clean up existing containers completely
        echo "🧹 Cleaning up existing containers..."
        docker-compose -f docker-compose.backend-only.yml down --remove-orphans || true
        docker-compose -f docker-compose.nginx.yml down --remove-orphans || true
        
        # Remove any conflicting containers
        docker rm -f acadion-backend acadion-redis acadion-nginx 2>/dev/null || true
        
        # Clean up unused networks and volumes
        docker network prune -f || true
        docker volume prune -f || true
        
        # Build and start backend services
        docker-compose -f docker-compose.backend-only.yml up -d --build --remove-orphans
        
        # Wait for services to be ready
        echo "⏳ Waiting for backend to start..."
        sleep 15
        
        # Health check
        if curl -f http://localhost:8000/api/health; then
          echo "✅ Backend deployment successful!"
        else
          echo "❌ Backend health check failed"
          exit 1
        fi
        
        echo "🎉 Backend deployment completed!"
        DEPLOY_SCRIPT

  update-frontend:
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    if: always() && needs.deploy-backend.result == 'success'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Update Frontend API URL
      run: |
        echo "🔧 Updating frontend to use https://api.acadion.online"
        
        # Install Vercel CLI
        npm install --global vercel@latest
        
        # Update environment variable (API URL already set to https://api.acadion.online)
        cd frontend
        
        # Redeploy frontend with current environment
        vercel pull --yes --environment=production --token=pd1H2Xw7hGdEZ846wg2o7AVF
        vercel build --prod --token=pd1H2Xw7hGdEZ846wg2o7AVF
        DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=pd1H2Xw7hGdEZ846wg2o7AVF)
        
        echo "✅ Frontend updated and redeployed!"
        echo "🌐 Frontend URL: $DEPLOYMENT_URL"

  health-check:
    runs-on: ubuntu-latest
    needs: [update-frontend]
    if: always() && needs.update-frontend.result == 'success'
    
    steps:
    - name: Complete Health Check
      run: |
        echo "🔍 Performing complete health check..."
        
        # Wait for DNS propagation
        sleep 30
        
        # Check backend API
        echo "🔍 Checking backend API..."
        if curl -f https://api.acadion.online/api/health; then
          echo "✅ Backend API is healthy"
        else
          echo "⚠️ Backend API check failed (might be DNS propagation)"
        fi
        
        # Check frontend
        echo "🔍 Checking frontend..."
        if curl -f https://acadion-gamma.vercel.app; then
          echo "✅ Frontend is healthy"
        else
          echo "❌ Frontend check failed"
          exit 1
        fi
        
        echo ""
        echo "🎉 Deployment Summary:"
        echo "   Frontend: https://acadion-gamma.vercel.app"
        echo "   Backend:  https://api.acadion.online"
        echo "   Status:   Ready for production!"