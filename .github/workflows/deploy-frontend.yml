name: Deploy Frontend

on:
  push:
    branches: [ main ]
    paths: 
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Test Frontend
      run: |
        cd frontend
        npm ci
        
        # Type check
        npm run type-check || echo "⚠️ Type check issues found"
        
        # Lint
        npm run lint || echo "⚠️ Lint issues found"
        
        # Build test
        npm run build
        echo "✅ Frontend build successful"
    
    - name: Deploy Preview (PR)
      if: github.event_name == 'pull_request'
      run: |
        echo "🚀 Deploying preview..."
        npm install -g vercel@latest
        
        cd frontend
        
        # Configure git to avoid author issues
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        
        # Pull Vercel environment information
        vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        
        # Build project
        vercel build --token=${{ secrets.VERCEL_TOKEN }}
        
        # Deploy prebuilt project (avoids git author issues)
        DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} --yes)
        echo "preview_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        echo "🌐 Preview: $DEPLOYMENT_URL"
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    
    - name: Deploy Production
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🚀 Deploying to production..."
        npm install -g vercel@latest
        
        cd frontend
        
        # Configure git to avoid author issues
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        
        # Pull Vercel environment information
        vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        
        # Build project
        vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        
        # Deploy prebuilt project (avoids git author issues)
        DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --yes)
        echo "production_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        echo "🌐 Production: $DEPLOYMENT_URL"
      env:
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    
    - name: Health Check
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🔍 Health check..."
        sleep 10
        
        # Test main production URL
        if curl -f https://acadion-gamma.vercel.app; then
          echo "✅ Frontend is healthy"
          echo "🌐 Frontend URL: https://acadion-gamma.vercel.app"
        else
          echo "❌ Frontend health check failed"
          exit 1
        fi
    
    - name: Comment PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const deploymentUrl = process.env.DEPLOYMENT_URL || 'Deployment failed';
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **Frontend Preview Ready!**
            
            **Preview URL**: ${deploymentUrl}
            **Backend**: http://54.167.95.26:8000
            
            Test your changes before merging!`
          });
      env:
        DEPLOYMENT_URL: ${{ steps.deploy-preview.outputs.preview_url }}