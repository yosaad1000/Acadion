name: Deploy Frontend to Vercel

on:
  push:
    branches: [ main ]
    paths: 
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Run linting
      run: |
        cd frontend
        npm run lint || true
    
    - name: Run type checking
      run: |
        cd frontend
        npm run type-check || true
    
    - name: Run tests
      run: |
        cd frontend
        npm run test || echo "Tests completed"
    
    - name: Build frontend
      run: |
        cd frontend
        npm run build
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/

  deploy-preview:
    needs: test-frontend
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Vercel CLI
      run: npm install --global vercel@latest
    
    - name: Pull Vercel Environment Information
      run: |
        cd frontend
        vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
    
    - name: Build Project Artifacts
      run: |
        cd frontend
        vercel build --token=${{ secrets.VERCEL_TOKEN }}
    
    - name: Deploy Project Artifacts to Vercel
      id: deploy
      run: |
        cd frontend
        DEPLOYMENT_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
        echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        echo "🚀 Preview deployment: $DEPLOYMENT_URL"
    
    - name: Comment PR
      uses: actions/github-script@v7
      if: github.event_name == 'pull_request'
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **Preview Deployment Ready!**
            
            **Frontend Preview**: ${{ steps.deploy.outputs.deployment_url }}
            
            The preview deployment has been automatically created for this PR.
            Test your changes and ensure everything works correctly before merging.`
          })

  deploy-production:
    needs: test-frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Vercel CLI
      run: npm install --global vercel@latest
    
    - name: Pull Vercel Environment Information
      run: |
        cd frontend
        vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
    
    - name: Build Project Artifacts
      run: |
        cd frontend
        vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
    
    - name: Deploy Project Artifacts to Vercel
      id: deploy
      run: |
        cd frontend
        DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
        echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
        echo "🚀 Production deployment: $DEPLOYMENT_URL"
    
    - name: Health Check
      run: |
        echo "🔍 Performing frontend health check..."
        sleep 10  # Wait for deployment to propagate
        
        # Check main production URL
        if curl -f https://acadion-gamma.vercel.app; then
          echo "✅ Frontend is accessible at https://acadion-gamma.vercel.app"
        else
          echo "❌ Frontend health check failed"
          exit 1
        fi
    
    - name: Deployment Summary
      run: |
        echo "🎉 Frontend deployment completed successfully!"
        echo ""
        echo "🌐 Frontend URLs:"
        echo "   Production: https://acadion-gamma.vercel.app"
        echo "   Alternative: https://acadion-yosaad1000s-projects.vercel.app"
        echo "   Latest Deploy: ${{ steps.deploy.outputs.deployment_url }}"
        echo ""
        echo "📊 Environment Variables:"
        echo "   VITE_API_URL: https://54.167.95.26 (HTTPS Backend)"
        echo "   VITE_ENVIRONMENT: production"