name: Deploy Documentation

on:
  push:
    branches: [ main ]
    paths: 
      - 'docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.1'
        bundler-cache: true
        working-directory: docs
    
    - name: Setup Pages
      id: pages
      uses: actions/configure-pages@v4
    
    - name: Build Documentation
      run: |
        cd docs
        
        # Install dependencies (idempotent)
        bundle install
        
        # Build site
        bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        echo "✅ Documentation built successfully"
      env:
        JEKYLL_ENV: production
    
    - name: Upload Pages Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/_site
    
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main'
      id: deployment
      uses: actions/deploy-pages@v4
    
    - name: Health Check
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🔍 Documentation health check..."
        sleep 5
        
        # Test documentation URL
        DOCS_URL="${{ steps.deployment.outputs.page_url }}"
        if curl -f "$DOCS_URL"; then
          echo "✅ Documentation is accessible"
          echo "📚 Docs URL: $DOCS_URL"
        else
          echo "⚠️ Documentation might still be deploying"
        fi