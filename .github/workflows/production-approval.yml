name: Production Deployment Approval

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (commit SHA or tag)'
        required: true
        type: string
      reason:
        description: 'Reason for production deployment'
        required: true
        type: string

env:
  AWS_REGION: us-east-1

jobs:
  request-approval:
    runs-on: ubuntu-latest
    
    steps:
    - name: Create deployment request
      run: |
        echo "## Production Deployment Request" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Image Tag:** ${{ github.event.inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
        echo "**Reason:** ${{ github.event.inputs.reason }}" >> $GITHUB_STEP_SUMMARY
        echo "**Requested by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
        echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "This deployment requires manual approval from authorized personnel." >> $GITHUB_STEP_SUMMARY

  pre-deployment-checks:
    runs-on: ubuntu-latest
    needs: request-approval
    
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PRODUCTION }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Verify image exists in ECR
      run: |
        IMAGE_TAG="${{ github.event.inputs.image_tag }}"
        
        # Check if images exist in ECR
        aws ecr describe-images \
          --repository-name acadion-backend \
          --image-ids imageTag=$IMAGE_TAG || exit 1
        
        aws ecr describe-images \
          --repository-name acadion-frontend \
          --image-ids imageTag=$IMAGE_TAG || exit 1
        
        aws ecr describe-images \
          --repository-name acadion-face-recognition \
          --image-ids imageTag=$IMAGE_TAG || exit 1
        
        echo "✅ All images found in ECR"

    - name: Check staging environment health
      run: |
        # Verify staging is healthy before production deployment
        ALB_DNS=$(aws elbv2 describe-load-balancers \
          --names acadion-staging-alb \
          --query 'LoadBalancers[0].DNSName' \
          --output text)
        
        curl -f "https://$ALB_DNS/api/health" || exit 1
        curl -f "https://$ALB_DNS/" || exit 1
        
        echo "✅ Staging environment is healthy"

    - name: Run security scan on images
      run: |
        IMAGE_TAG="${{ github.event.inputs.image_tag }}"
        
        # Run Trivy scan on production images
        docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          aquasec/trivy image \
          --exit-code 1 \
          --severity HIGH,CRITICAL \
          ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/acadion-backend:$IMAGE_TAG
        
        echo "✅ Security scan passed"

  manual-approval:
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment: production-approval
    
    steps:
    - name: Manual approval checkpoint
      run: |
        echo "🔐 Manual approval required for production deployment"
        echo "Image tag: ${{ github.event.inputs.image_tag }}"
        echo "Reason: ${{ github.event.inputs.reason }}"
        echo ""
        echo "Pre-deployment checks have passed. Deployment can proceed after approval."

  trigger-production-deployment:
    runs-on: ubuntu-latest
    needs: manual-approval
    
    steps:
    - name: Trigger production deployment
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const { data: workflow } = await github.rest.actions.createWorkflowDispatch({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'deploy-to-aws.yml',
            ref: 'main',
            inputs: {
              environment: 'production',
              force_deploy: 'false'
            }
          });
          
          console.log('Production deployment triggered');

  notify-approval:
    runs-on: ubuntu-latest
    needs: [manual-approval, trigger-production-deployment]
    if: always()
    
    steps:
    - name: Notify approval status
      run: |
        if [[ "${{ needs.trigger-production-deployment.result }}" == "success" ]]; then
          echo "✅ Production deployment approved and triggered"
          echo "Image tag: ${{ github.event.inputs.image_tag }}"
          echo "Approved by: ${{ github.actor }}"
        else
          echo "❌ Production deployment was not approved or failed to trigger"
        fi