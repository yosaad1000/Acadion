name: Build and Push to ECR

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  BACKEND_REPOSITORY: acadion-backend
  FRONTEND_REPOSITORY: acadion-frontend
  FACE_RECOGNITION_REPOSITORY: acadion-face-recognition

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
      security-events: write

    outputs:
      backend-image: ${{ steps.backend-meta.outputs.tags }}
      frontend-image: ${{ steps.frontend-meta.outputs.tags }}
      face-recognition-image: ${{ steps.face-recognition-meta.outputs.tags }}
      image-digest-backend: ${{ steps.backend-build.outputs.digest }}
      image-digest-frontend: ${{ steps.frontend-build.outputs.digest }}
      image-digest-face-recognition: ${{ steps.face-recognition-build.outputs.digest }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata for backend
      id: backend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.ECR_REGISTRY }}/${{ env.BACKEND_REPOSITORY }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Extract metadata for frontend
      id: frontend-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.ECR_REGISTRY }}/${{ env.FRONTEND_REPOSITORY }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Extract metadata for face recognition
      id: face-recognition-meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.ECR_REGISTRY }}/${{ env.FACE_RECOGNITION_REPOSITORY }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push backend image
      id: backend-build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.backend
        push: true
        tags: ${{ steps.backend-meta.outputs.tags }}
        labels: ${{ steps.backend-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

    - name: Build and push frontend image
      id: frontend-build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.frontend
        push: true
        tags: ${{ steps.frontend-meta.outputs.tags }}
        labels: ${{ steps.frontend-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

    - name: Create face recognition Dockerfile
      run: |
        cat > Dockerfile.face-recognition << 'EOF'
        # Face Recognition Microservice Dockerfile
        FROM animcogn/face_recognition

        # Set working directory
        WORKDIR /app

        # Install system dependencies for GPU support
        RUN apt-get update && \
            apt-get install -y --no-install-recommends \
                curl \
                wget \
                ca-certificates && \
            rm -rf /var/lib/apt/lists/*

        # Copy requirements for face recognition service
        COPY backend/requirements.txt .

        # Install Python dependencies
        RUN pip install --upgrade pip && \
            pip install --no-cache-dir -r requirements.txt && \
            pip install --no-cache-dir \
                fastapi==0.104.1 \
                uvicorn[standard]==0.24.0 \
                python-multipart==0.0.6 \
                pillow==10.1.0 \
                numpy==1.24.3

        # Create face recognition service structure
        RUN mkdir -p /app/face_service

        # Copy face recognition service files
        COPY backend/app/services/face_recognition_service.py /app/face_service/
        COPY backend/app/models/ /app/models/
        COPY backend/app/core/ /app/core/

        # Create main application file for face recognition service
        RUN cat > /app/face_service/main.py << 'PYEOF'
        from fastapi import FastAPI, UploadFile, File, HTTPException
        from fastapi.middleware.cors import CORSMiddleware
        import uvicorn
        import logging
        import os
        from typing import List, Optional
        import json

        # Configure logging
        logging.basicConfig(level=logging.INFO)
        logger = logging.getLogger(__name__)

        app = FastAPI(
            title="Face Recognition Microservice",
            description="AI-powered face recognition service for Acadion",
            version="1.0.0"
        )

        # Add CORS middleware
        app.add_middleware(
            CORSMiddleware,
            allow_origins=["*"],
            allow_credentials=True,
            allow_methods=["*"],
            allow_headers=["*"],
        )

        @app.get("/health")
        async def health_check():
            return {"status": "healthy", "service": "face-recognition"}

        @app.post("/process-image")
        async def process_image(image: UploadFile = File(...)):
            try:
                # Placeholder for face processing logic
                logger.info(f"Processing image: {image.filename}")
                return {
                    "faces_detected": 0,
                    "embeddings": [],
                    "confidence_scores": [],
                    "processing_time": 0.0
                }
            except Exception as e:
                logger.error(f"Error processing image: {e}")
                raise HTTPException(status_code=500, detail=str(e))

        @app.post("/register-face")
        async def register_face(user_id: str, image: UploadFile = File(...)):
            try:
                logger.info(f"Registering face for user: {user_id}")
                return {"success": True, "user_id": user_id}
            except Exception as e:
                logger.error(f"Error registering face: {e}")
                raise HTTPException(status_code=500, detail=str(e))

        if __name__ == "__main__":
            uvicorn.run(app, host="0.0.0.0", port=8001)
        PYEOF

        # Create non-root user for security
        RUN useradd -m -u 1000 appuser && chown -R appuser:appuser /app
        USER appuser

        # Set environment variables
        ENV PYTHONPATH=/app
        ENV PYTHONUNBUFFERED=1

        # Health check
        HEALTHCHECK --interval=30s --timeout=30s --start-period=5s --retries=3 \
            CMD python -c "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" || exit 1

        # Expose the port
        EXPOSE 8001

        # Run the face recognition service
        CMD ["python", "/app/face_service/main.py"]
        EOF

    - name: Build and push face recognition image
      id: face-recognition-build
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.face-recognition
        push: true
        tags: ${{ steps.face-recognition-meta.outputs.tags }}
        labels: ${{ steps.face-recognition-meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        platforms: linux/amd64

  vulnerability-scan:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'
    
    permissions:
      security-events: write
      contents: read

    strategy:
      matrix:
        image: 
          - { name: "backend", repository: "acadion-backend" }
          - { name: "frontend", repository: "acadion-frontend" }
          - { name: "face-recognition", repository: "acadion-face-recognition" }

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Run Trivy vulnerability scanner (SARIF)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.image.repository }}:${{ github.sha }}
        format: 'sarif'
        output: 'trivy-results-${{ matrix.image.name }}.sarif'
        severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results-${{ matrix.image.name }}.sarif'

    - name: Run Trivy vulnerability scanner (JSON report)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.image.repository }}:${{ github.sha }}
        format: 'json'
        output: 'trivy-results-${{ matrix.image.name }}.json'

    - name: Parse vulnerability results
      id: parse-vulns
      run: |
        # Parse JSON results and extract vulnerability counts
        CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results-${{ matrix.image.name }}.json || echo "0")
        HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results-${{ matrix.image.name }}.json || echo "0")
        MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-results-${{ matrix.image.name }}.json || echo "0")
        
        echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
        echo "high=$HIGH" >> $GITHUB_OUTPUT
        echo "medium=$MEDIUM" >> $GITHUB_OUTPUT
        
        echo "## Vulnerability Scan Results for ${{ matrix.image.name }}" >> $GITHUB_STEP_SUMMARY
        echo "- Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
        echo "- High: $HIGH" >> $GITHUB_STEP_SUMMARY
        echo "- Medium: $MEDIUM" >> $GITHUB_STEP_SUMMARY

    - name: Run Trivy vulnerability scanner (table format)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.image.repository }}:${{ github.sha }}
        format: 'table'
        exit-code: '0'  # Don't fail here, we'll handle it in security gate
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

    - name: Upload vulnerability reports as artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vulnerability-reports-${{ matrix.image.name }}
        path: |
          trivy-results-${{ matrix.image.name }}.sarif
          trivy-results-${{ matrix.image.name }}.json
        retention-days: 30

    - name: Check security thresholds
      run: |
        CRITICAL=${{ steps.parse-vulns.outputs.critical }}
        HIGH=${{ steps.parse-vulns.outputs.high }}
        
        echo "Security scan results for ${{ matrix.image.name }}:"
        echo "  Critical vulnerabilities: $CRITICAL"
        echo "  High vulnerabilities: $HIGH"
        
        # Set thresholds (can be configured via environment variables)
        MAX_CRITICAL=${MAX_CRITICAL_VULNS:-0}
        MAX_HIGH=${MAX_HIGH_VULNS:-5}
        
        if [ "$CRITICAL" -gt "$MAX_CRITICAL" ]; then
          echo "❌ SECURITY GATE FAILED: $CRITICAL critical vulnerabilities found (max allowed: $MAX_CRITICAL)"
          echo "security_gate_status=failed" >> $GITHUB_ENV
          exit 1
        elif [ "$HIGH" -gt "$MAX_HIGH" ]; then
          echo "⚠️  SECURITY WARNING: $HIGH high vulnerabilities found (max recommended: $MAX_HIGH)"
          echo "security_gate_status=warning" >> $GITHUB_ENV
        else
          echo "✅ Security gate passed for ${{ matrix.image.name }}"
          echo "security_gate_status=passed" >> $GITHUB_ENV
        fi

  security-gate:
    runs-on: ubuntu-latest
    needs: [build-and-push, vulnerability-scan]
    if: always() && github.event_name != 'pull_request'
    
    steps:
    - name: Check vulnerability scan results
      run: |
        if [[ "${{ needs.vulnerability-scan.result }}" == "failure" ]]; then
          echo "❌ Security gate failed: Critical or high vulnerabilities found"
          echo "Images have been built but deployment should be blocked"
          exit 1
        else
          echo "✅ Security gate passed: No critical vulnerabilities found"
        fi

  notify-success:
    runs-on: ubuntu-latest
    needs: [build-and-push, vulnerability-scan, security-gate]
    if: success() && github.event_name != 'pull_request'
    
    steps:
    - name: Notify successful build
      run: |
        echo "🎉 Build and security scan completed successfully!"
        echo "Images pushed to ECR:"
        echo "  Backend: ${{ needs.build-and-push.outputs.backend-image }}"
        echo "  Frontend: ${{ needs.build-and-push.outputs.frontend-image }}"
        echo "  Face Recognition: ${{ needs.build-and-push.outputs.face-recognition-image }}"
        echo ""
        echo "Image digests:"
        echo "  Backend: ${{ needs.build-and-push.outputs.image-digest-backend }}"
        echo "  Frontend: ${{ needs.build-and-push.outputs.image-digest-frontend }}"
        echo "  Face Recognition: ${{ needs.build-and-push.outputs.image-digest-face-recognition }}"