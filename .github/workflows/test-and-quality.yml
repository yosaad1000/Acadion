name: Test and Quality Assurance

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.8'
  NODE_VERSION: '18'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov pytest-mock httpx

    - name: Create test environment file
      run: |
        cd backend
        cat > .env.test << 'EOF'
        # Test environment configuration
        SUPABASE_URL=https://test.supabase.co
        SUPABASE_KEY=test_key
        SUPABASE_SERVICE_KEY=test_service_key
        SECRET_KEY=test_secret_key_for_jwt_signing_in_tests_only
        PINECONE_API_KEY=test_pinecone_key
        PINECONE_ENVIRONMENT=us-east-1
        PINECONE_INDEX_NAME=test-index
        FACE_THRESHOLD=0.6
        REDIS_URL=redis://localhost:6379
        ENVIRONMENT=test
        EOF

    - name: Run backend unit tests
      run: |
        cd backend
        python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
      env:
        PYTHONPATH: ${{ github.workspace }}/backend

    - name: Upload backend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Create test environment file
      run: |
        cd frontend
        cat > .env.test << 'EOF'
        VITE_SUPABASE_URL=https://test.supabase.co
        VITE_SUPABASE_ANON_KEY=test_anon_key
        VITE_API_URL=http://localhost:8000
        VITE_ENVIRONMENT=test
        EOF

    - name: Run frontend unit tests
      run: |
        cd frontend
        npm run test -- --coverage --reporter=verbose

    - name: Run frontend linting
      run: |
        cd frontend
        npx eslint src --ext .ts,.tsx --max-warnings 0

    - name: Run frontend type checking
      run: |
        cd frontend
        npx tsc --noEmit

    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./frontend/coverage/coverage-final.json
        flags: frontend
        name: frontend-coverage

  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install backend dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio httpx

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Create integration test environment
      run: |
        cd backend
        cat > .env.integration << 'EOF'
        SUPABASE_URL=https://test.supabase.co
        SUPABASE_KEY=test_key
        SUPABASE_SERVICE_KEY=test_service_key
        SECRET_KEY=integration_test_secret_key
        PINECONE_API_KEY=test_pinecone_key
        PINECONE_ENVIRONMENT=us-east-1
        PINECONE_INDEX_NAME=integration-test-index
        FACE_THRESHOLD=0.6
        REDIS_URL=redis://localhost:6379
        ENVIRONMENT=integration
        EOF

    - name: Start backend server for integration tests
      run: |
        cd backend
        python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
        sleep 10
      env:
        PYTHONPATH: ${{ github.workspace }}/backend

    - name: Wait for backend to be ready
      run: |
        timeout 30 bash -c 'until curl -f http://localhost:8000/api/health; do sleep 1; done'

    - name: Run integration tests
      run: |
        cd backend
        python -m pytest tests/test_*_integration.py -v
      env:
        PYTHONPATH: ${{ github.workspace }}/backend
        API_BASE_URL: http://localhost:8000

  security-scanning:
    runs-on: ubuntu-latest
    
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep

    - name: Run Bandit security scan (Python)
      run: |
        cd backend
        bandit -r app/ -f json -o bandit-report.json || true
        bandit -r app/ -f txt

    - name: Run Safety check (Python dependencies)
      run: |
        cd backend
        safety check --json --output safety-report.json || true
        safety check

    - name: Set up Node.js for frontend security scanning
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run npm audit (Node.js dependencies)
      run: |
        cd frontend
        npm audit --audit-level=moderate --json > npm-audit-report.json || true
        npm audit --audit-level=moderate

    - name: Run Semgrep SAST scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
          p/react
          p/python
        generateSarif: "1"

    - name: Upload Semgrep results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: semgrep.sarif

  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Shallow clones should be disabled for better analysis

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Python quality tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Run Python code formatting check (Black)
      run: |
        cd backend
        black --check --diff app/

    - name: Run Python import sorting check (isort)
      run: |
        cd backend
        isort --check-only --diff app/

    - name: Run Python linting (Flake8)
      run: |
        cd backend
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run Python type checking (MyPy)
      run: |
        cd backend
        mypy app/ --ignore-missing-imports || true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run frontend linting (ESLint)
      run: |
        cd frontend
        npx eslint src --ext .ts,.tsx --format json --output-file eslint-report.json || true
        npx eslint src --ext .ts,.tsx

    - name: Run frontend formatting check (Prettier)
      run: |
        cd frontend
        npx prettier --check src/

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=acadion-platform
          -Dsonar.organization=acadion
          -Dsonar.sources=backend/app,frontend/src
          -Dsonar.tests=backend/tests,frontend/src/test
          -Dsonar.python.coverage.reportPaths=backend/coverage.xml
          -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
          -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**

  test-summary:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, integration-tests, security-scanning, code-quality]
    if: always()

    steps:
    - name: Test Results Summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ "${{ needs.backend-tests.result }}" == "success" ]]; then
          echo "✅ Backend Tests: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Backend Tests: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ "${{ needs.frontend-tests.result }}" == "success" ]]; then
          echo "✅ Frontend Tests: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Frontend Tests: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ "${{ needs.integration-tests.result }}" == "success" ]]; then
          echo "✅ Integration Tests: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Integration Tests: FAILED" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ "${{ needs.security-scanning.result }}" == "success" ]]; then
          echo "✅ Security Scanning: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Security Scanning: ISSUES FOUND" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [[ "${{ needs.code-quality.result }}" == "success" ]]; then
          echo "✅ Code Quality: PASSED" >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ Code Quality: ISSUES FOUND" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Check overall test status
      run: |
        if [[ "${{ needs.backend-tests.result }}" != "success" ]] || [[ "${{ needs.frontend-tests.result }}" != "success" ]] || [[ "${{ needs.integration-tests.result }}" != "success" ]]; then
          echo "❌ Critical tests failed - blocking deployment"
          exit 1
        else
          echo "✅ All critical tests passed - ready for deployment"
        fi