name: Security Scanning and Compliance

on:
  schedule:
    # Run daily security scans at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - containers
          - dependencies
          - secrets
          - infrastructure

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  container-security-scan:
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'containers' || github.event_name == 'schedule'
    
    permissions:
      security-events: write
      contents: read
      id-token: write

    strategy:
      matrix:
        repository: 
          - acadion-backend
          - acadion-frontend
          - acadion-face-recognition

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      uses: aws-actions/amazon-ecr-login@v2

    - name: Get latest image tag
      id: get-tag
      run: |
        # Get the latest image tag from ECR
        LATEST_TAG=$(aws ecr describe-images \
          --repository-name ${{ matrix.repository }} \
          --query 'sort_by(imageDetails,& imageDigest)[*].imageTags[0]' \
          --output text | tail -1)
        
        if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "None" ]; then
          echo "No images found in repository ${{ matrix.repository }}"
          exit 1
        fi
        
        echo "tag=$LATEST_TAG" >> $GITHUB_OUTPUT
        echo "Latest tag for ${{ matrix.repository }}: $LATEST_TAG"

    - name: Run comprehensive Trivy scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.repository }}:${{ steps.get-tag.outputs.tag }}
        format: 'sarif'
        output: 'trivy-results-${{ matrix.repository }}.sarif'
        severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
        vuln-type: 'os,library'
        scanners: 'vuln,secret,config'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results-${{ matrix.repository }}.sarif'

    - name: Run Trivy configuration scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.ECR_REGISTRY }}/${{ matrix.repository }}:${{ steps.get-tag.outputs.tag }}
        format: 'json'
        output: 'trivy-config-${{ matrix.repository }}.json'
        scanners: 'config'

    - name: Generate security report
      run: |
        echo "# Security Scan Report for ${{ matrix.repository }}" > security-report-${{ matrix.repository }}.md
        echo "**Scan Date:** $(date)" >> security-report-${{ matrix.repository }}.md
        echo "**Image:** ${{ env.ECR_REGISTRY }}/${{ matrix.repository }}:${{ steps.get-tag.outputs.tag }}" >> security-report-${{ matrix.repository }}.md
        echo "" >> security-report-${{ matrix.repository }}.md
        
        # Parse vulnerability results
        if [ -f "trivy-results-${{ matrix.repository }}.sarif" ]; then
          echo "## Vulnerability Summary" >> security-report-${{ matrix.repository }}.md
          echo "Detailed results uploaded to GitHub Security tab" >> security-report-${{ matrix.repository }}.md
        fi
        
        # Parse configuration issues
        if [ -f "trivy-config-${{ matrix.repository }}.json" ]; then
          CONFIG_ISSUES=$(jq '[.Results[]?.Misconfigurations[]?] | length' trivy-config-${{ matrix.repository }}.json || echo "0")
          echo "## Configuration Issues: $CONFIG_ISSUES" >> security-report-${{ matrix.repository }}.md
        fi

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports-${{ matrix.repository }}
        path: |
          trivy-results-${{ matrix.repository }}.sarif
          trivy-config-${{ matrix.repository }}.json
          security-report-${{ matrix.repository }}.md
        retention-days: 90

  dependency-security-scan:
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'dependencies' || github.event_name == 'schedule'
    
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Python dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install safety bandit semgrep

    - name: Run Python dependency security scan
      run: |
        cd backend
        echo "## Python Dependency Security Scan" > ../python-security-report.md
        echo "**Scan Date:** $(date)" >> ../python-security-report.md
        echo "" >> ../python-security-report.md
        
        # Run safety check
        echo "### Safety Check Results" >> ../python-security-report.md
        safety check --json --output safety-report.json || true
        
        if [ -f "safety-report.json" ]; then
          VULN_COUNT=$(jq '. | length' safety-report.json || echo "0")
          echo "**Vulnerabilities found:** $VULN_COUNT" >> ../python-security-report.md
        fi
        
        # Run bandit security scan
        echo "### Bandit Security Scan Results" >> ../python-security-report.md
        bandit -r app/ -f json -o bandit-report.json || true
        
        if [ -f "bandit-report.json" ]; then
          ISSUES_COUNT=$(jq '.results | length' bandit-report.json || echo "0")
          echo "**Security issues found:** $ISSUES_COUNT" >> ../python-security-report.md
        fi

    - name: Install Node.js dependencies
      run: |
        cd frontend
        npm ci

    - name: Run Node.js dependency security scan
      run: |
        cd frontend
        echo "## Node.js Dependency Security Scan" > ../nodejs-security-report.md
        echo "**Scan Date:** $(date)" >> ../nodejs-security-report.md
        echo "" >> ../nodejs-security-report.md
        
        # Run npm audit
        echo "### NPM Audit Results" >> ../nodejs-security-report.md
        npm audit --audit-level=moderate --json > npm-audit-report.json || true
        
        if [ -f "npm-audit-report.json" ]; then
          VULN_COUNT=$(jq '.metadata.vulnerabilities.total' npm-audit-report.json || echo "0")
          echo "**Vulnerabilities found:** $VULN_COUNT" >> ../nodejs-security-report.md
        fi

    - name: Upload dependency security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: dependency-security-reports
        path: |
          python-security-report.md
          nodejs-security-report.md
          backend/safety-report.json
          backend/bandit-report.json
          frontend/npm-audit-report.json
        retention-days: 90

  secrets-scan:
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'secrets' || github.event_name == 'schedule'
    
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for secret scanning

    - name: Run TruffleHog secret scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

    - name: Run GitLeaks secret scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  infrastructure-security-scan:
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'infrastructure' || github.event_name == 'schedule'
    
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.5.0

    - name: Run Checkov infrastructure security scan
      uses: bridgecrewio/checkov-action@master
      with:
        directory: terraform/
        framework: terraform
        output_format: sarif
        output_file_path: checkov-results.sarif

    - name: Upload Checkov scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: checkov-results.sarif

    - name: Run tfsec Terraform security scan
      uses: aquasecurity/tfsec-sarif-action@v0.1.4
      with:
        sarif_file: tfsec-results.sarif

    - name: Upload tfsec scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: tfsec-results.sarif

  security-notification:
    runs-on: ubuntu-latest
    needs: [container-security-scan, dependency-security-scan, secrets-scan, infrastructure-security-scan]
    if: always() && (github.event_name == 'schedule' || github.event.inputs.scan_type == 'all')
    
    steps:
    - name: Generate security summary
      run: |
        echo "# Daily Security Scan Summary" > security-summary.md
        echo "**Date:** $(date)" >> security-summary.md
        echo "" >> security-summary.md
        
        # Check job results
        echo "## Scan Results" >> security-summary.md
        
        if [[ "${{ needs.container-security-scan.result }}" == "success" ]]; then
          echo "✅ Container Security Scan: PASSED" >> security-summary.md
        else
          echo "❌ Container Security Scan: FAILED" >> security-summary.md
        fi
        
        if [[ "${{ needs.dependency-security-scan.result }}" == "success" ]]; then
          echo "✅ Dependency Security Scan: PASSED" >> security-summary.md
        else
          echo "❌ Dependency Security Scan: FAILED" >> security-summary.md
        fi
        
        if [[ "${{ needs.secrets-scan.result }}" == "success" ]]; then
          echo "✅ Secrets Scan: PASSED" >> security-summary.md
        else
          echo "❌ Secrets Scan: FAILED" >> security-summary.md
        fi
        
        if [[ "${{ needs.infrastructure-security-scan.result }}" == "success" ]]; then
          echo "✅ Infrastructure Security Scan: PASSED" >> security-summary.md
        else
          echo "❌ Infrastructure Security Scan: FAILED" >> security-summary.md
        fi
        
        echo "" >> security-summary.md
        echo "Detailed reports are available in the GitHub Security tab and workflow artifacts." >> security-summary.md

    - name: Upload security summary
      uses: actions/upload-artifact@v4
      with:
        name: security-summary
        path: security-summary.md
        retention-days: 90

    - name: Notify on security issues
      if: needs.container-security-scan.result == 'failure' || needs.dependency-security-scan.result == 'failure' || needs.secrets-scan.result == 'failure' || needs.infrastructure-security-scan.result == 'failure'
      run: |
        echo "🚨 Security scan failures detected!"
        echo "Please review the security reports and take appropriate action."
        # In a real environment, you would send notifications to Slack, email, etc.
        exit 1