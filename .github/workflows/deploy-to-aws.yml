name: Deploy to AWS ECS

on:
  workflow_run:
    workflows: ["Build and Push to ECR", "Test and Quality Assurance"]
    types:
      - completed
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Force deployment even if tests failed'
        required: false
        default: false
        type: boolean

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  check-prerequisites:
    runs-on: ubuntu-latest
    outputs:
      should-deploy: ${{ steps.check.outputs.should-deploy }}
      environment: ${{ steps.check.outputs.environment }}
      image-tag: ${{ steps.check.outputs.image-tag }}
    
    steps:
    - name: Check deployment prerequisites
      id: check
      run: |
        # Determine environment
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          ENVIRONMENT="${{ github.event.inputs.environment }}"
          FORCE_DEPLOY="${{ github.event.inputs.force_deploy }}"
        else
          ENVIRONMENT="staging"
          FORCE_DEPLOY="false"
        fi
        
        # Check if tests passed (unless force deploy)
        if [[ "${{ github.event.workflow_run.conclusion }}" == "failure" && "$FORCE_DEPLOY" != "true" ]]; then
          echo "❌ Tests failed and force_deploy is not enabled"
          echo "should-deploy=false" >> $GITHUB_OUTPUT
          exit 1
        fi
        
        # Set image tag based on trigger
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          IMAGE_TAG="${{ github.sha }}"
        else
          IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
        fi
        
        echo "should-deploy=true" >> $GITHUB_OUTPUT
        echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
        echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
        
        echo "✅ Prerequisites check passed"
        echo "Environment: $ENVIRONMENT"
        echo "Image tag: $IMAGE_TAG"

  deploy-staging:
    runs-on: ubuntu-latest
    needs: check-prerequisites
    if: needs.check-prerequisites.outputs.should-deploy == 'true' && needs.check-prerequisites.outputs.environment == 'staging'
    environment: staging
    
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_STAGING }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Deploy to staging ECS
      run: |
        # Update ECS service with new image
        aws ecs update-service \
          --cluster acadion-staging-cluster \
          --service acadion-backend-staging \
          --task-definition acadion-backend-staging \
          --force-new-deployment \
          --desired-count 2

        aws ecs update-service \
          --cluster acadion-staging-cluster \
          --service acadion-frontend-staging \
          --task-definition acadion-frontend-staging \
          --force-new-deployment \
          --desired-count 2

        aws ecs update-service \
          --cluster acadion-staging-cluster \
          --service acadion-face-recognition-staging \
          --task-definition acadion-face-recognition-staging \
          --force-new-deployment \
          --desired-count 1

    - name: Wait for deployment to complete
      run: |
        echo "⏳ Waiting for services to stabilize..."
        
        aws ecs wait services-stable \
          --cluster acadion-staging-cluster \
          --services acadion-backend-staging acadion-frontend-staging acadion-face-recognition-staging
        
        echo "✅ Staging deployment completed successfully"

    - name: Run smoke tests
      run: |
        # Wait for ALB to be ready
        sleep 30
        
        # Get ALB DNS name
        ALB_DNS=$(aws elbv2 describe-load-balancers \
          --names acadion-staging-alb \
          --query 'LoadBalancers[0].DNSName' \
          --output text)
        
        # Health check
        curl -f "https://$ALB_DNS/api/health" || exit 1
        curl -f "https://$ALB_DNS/" || exit 1
        
        echo "✅ Smoke tests passed"

  deploy-production:
    runs-on: ubuntu-latest
    needs: check-prerequisites
    if: needs.check-prerequisites.outputs.should-deploy == 'true' && needs.check-prerequisites.outputs.environment == 'production'
    environment: production
    
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME_PRODUCTION }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Create new task definitions with updated images
      run: |
        # Get current task definitions
        BACKEND_TASK_DEF=$(aws ecs describe-task-definition \
          --task-definition acadion-backend-production \
          --query 'taskDefinition')
        
        FRONTEND_TASK_DEF=$(aws ecs describe-task-definition \
          --task-definition acadion-frontend-production \
          --query 'taskDefinition')
        
        FACE_RECOGNITION_TASK_DEF=$(aws ecs describe-task-definition \
          --task-definition acadion-face-recognition-production \
          --query 'taskDefinition')
        
        # Update image URIs
        BACKEND_IMAGE="${{ env.ECR_REGISTRY }}/acadion-backend:${{ needs.check-prerequisites.outputs.image-tag }}"
        FRONTEND_IMAGE="${{ env.ECR_REGISTRY }}/acadion-frontend:${{ needs.check-prerequisites.outputs.image-tag }}"
        FACE_RECOGNITION_IMAGE="${{ env.ECR_REGISTRY }}/acadion-face-recognition:${{ needs.check-prerequisites.outputs.image-tag }}"
        
        # Create updated task definitions
        echo "$BACKEND_TASK_DEF" | jq --arg IMAGE "$BACKEND_IMAGE" \
          '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)' \
          > backend-task-def.json
        
        echo "$FRONTEND_TASK_DEF" | jq --arg IMAGE "$FRONTEND_IMAGE" \
          '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)' \
          > frontend-task-def.json
        
        echo "$FACE_RECOGNITION_TASK_DEF" | jq --arg IMAGE "$FACE_RECOGNITION_IMAGE" \
          '.containerDefinitions[0].image = $IMAGE | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .placementConstraints, .compatibilities, .registeredAt, .registeredBy)' \
          > face-recognition-task-def.json
        
        # Register new task definitions
        aws ecs register-task-definition --cli-input-json file://backend-task-def.json
        aws ecs register-task-definition --cli-input-json file://frontend-task-def.json
        aws ecs register-task-definition --cli-input-json file://face-recognition-task-def.json

    - name: Blue-Green Deployment - Backend
      run: |
        echo "🔄 Starting blue-green deployment for backend..."
        
        # Get current service configuration
        CURRENT_SERVICE=$(aws ecs describe-services \
          --cluster acadion-production-cluster \
          --services acadion-backend-production \
          --query 'services[0]')
        
        CURRENT_DESIRED_COUNT=$(echo "$CURRENT_SERVICE" | jq -r '.desiredCount')
        CURRENT_TASK_DEF=$(echo "$CURRENT_SERVICE" | jq -r '.taskDefinition')
        
        echo "Current desired count: $CURRENT_DESIRED_COUNT"
        echo "Current task definition: $CURRENT_TASK_DEF"
        
        # Scale up with new task definition (Green)
        NEW_DESIRED_COUNT=$((CURRENT_DESIRED_COUNT * 2))
        
        aws ecs update-service \
          --cluster acadion-production-cluster \
          --service acadion-backend-production \
          --task-definition acadion-backend-production \
          --desired-count $NEW_DESIRED_COUNT
        
        # Wait for new tasks to be running
        echo "⏳ Waiting for green environment to be ready..."
        aws ecs wait services-stable \
          --cluster acadion-production-cluster \
          --services acadion-backend-production
        
        # Health check on new deployment
        sleep 30
        ALB_DNS=$(aws elbv2 describe-load-balancers \
          --names acadion-production-alb \
          --query 'LoadBalancers[0].DNSName' \
          --output text)
        
        # Test new deployment
        for i in {1..5}; do
          if curl -f "https://$ALB_DNS/api/health"; then
            echo "✅ Health check $i passed"
          else
            echo "❌ Health check $i failed"
            exit 1
          fi
          sleep 10
        done
        
        # Scale back to original count (removes old tasks)
        aws ecs update-service \
          --cluster acadion-production-cluster \
          --service acadion-backend-production \
          --desired-count $CURRENT_DESIRED_COUNT
        
        echo "✅ Backend blue-green deployment completed"

    - name: Blue-Green Deployment - Frontend
      run: |
        echo "🔄 Starting blue-green deployment for frontend..."
        
        # Similar process for frontend
        CURRENT_SERVICE=$(aws ecs describe-services \
          --cluster acadion-production-cluster \
          --services acadion-frontend-production \
          --query 'services[0]')
        
        CURRENT_DESIRED_COUNT=$(echo "$CURRENT_SERVICE" | jq -r '.desiredCount')
        NEW_DESIRED_COUNT=$((CURRENT_DESIRED_COUNT * 2))
        
        aws ecs update-service \
          --cluster acadion-production-cluster \
          --service acadion-frontend-production \
          --task-definition acadion-frontend-production \
          --desired-count $NEW_DESIRED_COUNT
        
        aws ecs wait services-stable \
          --cluster acadion-production-cluster \
          --services acadion-frontend-production
        
        # Test frontend
        sleep 30
        ALB_DNS=$(aws elbv2 describe-load-balancers \
          --names acadion-production-alb \
          --query 'LoadBalancers[0].DNSName' \
          --output text)
        
        curl -f "https://$ALB_DNS/" || exit 1
        
        # Scale back
        aws ecs update-service \
          --cluster acadion-production-cluster \
          --service acadion-frontend-production \
          --desired-count $CURRENT_DESIRED_COUNT
        
        echo "✅ Frontend blue-green deployment completed"

    - name: Blue-Green Deployment - Face Recognition
      run: |
        echo "🔄 Starting blue-green deployment for face recognition service..."
        
        # Face recognition service deployment
        CURRENT_SERVICE=$(aws ecs describe-services \
          --cluster acadion-production-cluster \
          --services acadion-face-recognition-production \
          --query 'services[0]')
        
        CURRENT_DESIRED_COUNT=$(echo "$CURRENT_SERVICE" | jq -r '.desiredCount')
        NEW_DESIRED_COUNT=$((CURRENT_DESIRED_COUNT * 2))
        
        # Ensure minimum of 2 for blue-green
        if [ $NEW_DESIRED_COUNT -lt 2 ]; then
          NEW_DESIRED_COUNT=2
        fi
        
        aws ecs update-service \
          --cluster acadion-production-cluster \
          --service acadion-face-recognition-production \
          --task-definition acadion-face-recognition-production \
          --desired-count $NEW_DESIRED_COUNT
        
        aws ecs wait services-stable \
          --cluster acadion-production-cluster \
          --services acadion-face-recognition-production
        
        # Test face recognition service (internal health check)
        sleep 30
        
        # Scale back
        aws ecs update-service \
          --cluster acadion-production-cluster \
          --service acadion-face-recognition-production \
          --desired-count $CURRENT_DESIRED_COUNT
        
        echo "✅ Face recognition blue-green deployment completed"

    - name: Final health checks
      run: |
        echo "🔍 Running final health checks..."
        
        ALB_DNS=$(aws elbv2 describe-load-balancers \
          --names acadion-production-alb \
          --query 'LoadBalancers[0].DNSName' \
          --output text)
        
        # Comprehensive health checks
        curl -f "https://$ALB_DNS/api/health" || exit 1
        curl -f "https://$ALB_DNS/" || exit 1
        
        # Test API endpoints
        curl -f "https://$ALB_DNS/api/auth/health" || exit 1
        
        echo "✅ All health checks passed - Production deployment successful!"

  rollback:
    runs-on: ubuntu-latest
    if: failure() && (needs.deploy-staging.result == 'failure' || needs.deploy-production.result == 'failure')
    needs: [check-prerequisites, deploy-staging, deploy-production]
    environment: ${{ needs.check-prerequisites.outputs.environment }}
    
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ needs.check-prerequisites.outputs.environment == 'production' && secrets.AWS_ROLE_TO_ASSUME_PRODUCTION || secrets.AWS_ROLE_TO_ASSUME_STAGING }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Rollback deployment
      run: |
        ENVIRONMENT="${{ needs.check-prerequisites.outputs.environment }}"
        CLUSTER_NAME="acadion-${ENVIRONMENT}-cluster"
        
        echo "🔄 Rolling back deployment in $ENVIRONMENT environment..."
        
        # Get previous task definition revisions
        BACKEND_PREV_REVISION=$(aws ecs describe-task-definition \
          --task-definition acadion-backend-${ENVIRONMENT} \
          --query 'taskDefinition.revision' \
          --output text)
        
        FRONTEND_PREV_REVISION=$(aws ecs describe-task-definition \
          --task-definition acadion-frontend-${ENVIRONMENT} \
          --query 'taskDefinition.revision' \
          --output text)
        
        FACE_RECOGNITION_PREV_REVISION=$(aws ecs describe-task-definition \
          --task-definition acadion-face-recognition-${ENVIRONMENT} \
          --query 'taskDefinition.revision' \
          --output text)
        
        # Calculate previous revision numbers
        BACKEND_ROLLBACK_REVISION=$((BACKEND_PREV_REVISION - 1))
        FRONTEND_ROLLBACK_REVISION=$((FRONTEND_PREV_REVISION - 1))
        FACE_RECOGNITION_ROLLBACK_REVISION=$((FACE_RECOGNITION_PREV_REVISION - 1))
        
        # Rollback services to previous task definitions
        aws ecs update-service \
          --cluster $CLUSTER_NAME \
          --service acadion-backend-${ENVIRONMENT} \
          --task-definition acadion-backend-${ENVIRONMENT}:${BACKEND_ROLLBACK_REVISION} \
          --force-new-deployment
        
        aws ecs update-service \
          --cluster $CLUSTER_NAME \
          --service acadion-frontend-${ENVIRONMENT} \
          --task-definition acadion-frontend-${ENVIRONMENT}:${FRONTEND_ROLLBACK_REVISION} \
          --force-new-deployment
        
        aws ecs update-service \
          --cluster $CLUSTER_NAME \
          --service acadion-face-recognition-${ENVIRONMENT} \
          --task-definition acadion-face-recognition-${ENVIRONMENT}:${FACE_RECOGNITION_ROLLBACK_REVISION} \
          --force-new-deployment
        
        # Wait for rollback to complete
        aws ecs wait services-stable \
          --cluster $CLUSTER_NAME \
          --services acadion-backend-${ENVIRONMENT} acadion-frontend-${ENVIRONMENT} acadion-face-recognition-${ENVIRONMENT}
        
        echo "✅ Rollback completed successfully"

  notify:
    runs-on: ubuntu-latest
    needs: [check-prerequisites, deploy-staging, deploy-production, rollback]
    if: always()
    
    steps:
    - name: Notify deployment status
      run: |
        ENVIRONMENT="${{ needs.check-prerequisites.outputs.environment }}"
        
        if [[ "${{ needs.deploy-staging.result }}" == "success" ]] || [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
          echo "🎉 Deployment to $ENVIRONMENT completed successfully!"
          echo "Image tag: ${{ needs.check-prerequisites.outputs.image-tag }}"
        elif [[ "${{ needs.rollback.result }}" == "success" ]]; then
          echo "⚠️ Deployment failed but rollback completed successfully"
        else
          echo "❌ Deployment failed"
        fi