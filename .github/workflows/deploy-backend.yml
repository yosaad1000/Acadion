name: Deploy Backend

on:
  push:
    branches: [ main ]
    paths: 
      - 'backend/**'
      - 'docker-compose*.yml'
      - 'Dockerfile.backend'
      - 'nginx.conf'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  EC2_HOST: 54.167.95.26
  DOMAIN: api.acadion.online

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Test Backend (Docker Build Only)
      run: |
        echo "🧪 Testing backend with Docker build..."
        
        # Test Docker build (this includes all dependencies)
        docker build -f Dockerfile.backend -t acadion-backend-test .
        
        # Test container can start (quick test)
        docker run --rm -d --name test-backend acadion-backend-test &
        sleep 5
        docker stop test-backend 2>/dev/null || true
        
        echo "✅ Docker build and container test successful"
    
    - name: Deploy to EC2 with Domain SSL
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🚀 Deploying backend with domain SSL to EC2..."
        
        # Create deployment package (include nginx config)
        tar -czf backend-deploy.tar.gz \
          backend/ \
          docker-compose.nginx.yml \
          docker-compose.backend-only.yml \
          Dockerfile.backend \
          nginx.conf \
          generate-ssl.sh
        
        # Setup SSH
        echo "${{ secrets.EC2_PRIVATE_KEY }}" > key.pem
        chmod 600 key.pem
        
        # Deploy script (idempotent with domain SSL)
        cat > deploy.sh << 'EOF'
        #!/bin/bash
        set -e
        
        # Create project directory (idempotent)
        mkdir -p /home/ec2-user/acadion
        cd /home/ec2-user/acadion
        
        # Extract code
        tar -xzf /tmp/backend-deploy.tar.gz
        
        # Create environment file (idempotent)
        cat > backend/.env << 'ENVEOF'
        SUPABASE_URL=${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}
        SUPABASE_SERVICE_KEY=${{ secrets.SUPABASE_SERVICE_KEY }}
        SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
        PINECONE_API_KEY=${{ secrets.PINECONE_API_KEY }}
        PINECONE_ENVIRONMENT=${{ secrets.PINECONE_ENVIRONMENT }}
        PINECONE_INDEX_NAME=${{ secrets.PINECONE_INDEX_NAME }}
        FACE_THRESHOLD=0.6
        REDIS_URL=redis://redis:6379
        ENVEOF
        
        # Stop existing containers (idempotent)
        docker-compose -f docker-compose.nginx.yml down --remove-orphans 2>/dev/null || true
        docker-compose -f docker-compose.backend-only.yml down --remove-orphans 2>/dev/null || true
        
        # Clean up old containers (idempotent)
        docker container prune -f || true
        docker image prune -f || true
        
        # Check if SSL certificates exist for domain
        if sudo test -f /etc/letsencrypt/live/api.acadion.online/fullchain.pem; then
          echo "🔐 SSL certificates found, deploying with nginx + HTTPS..."
          docker-compose -f docker-compose.nginx.yml up -d --build
          
          # Wait for services
          echo "⏳ Waiting for services to start..."
          sleep 20
          
          # Health check via domain
          for i in {1..15}; do
            if curl -f https://api.acadion.online/api/health 2>/dev/null; then
              echo "✅ Backend is healthy via HTTPS domain"
              exit 0
            fi
            sleep 2
          done
          
          echo "⚠️ Domain health check failed, trying localhost HTTPS..."
          if curl -k -f https://localhost/api/health 2>/dev/null; then
            echo "✅ Backend is healthy via localhost HTTPS"
            exit 0
          fi
        else
          echo "⚠️ No SSL certificates found, deploying backend-only..."
          docker-compose -f docker-compose.backend-only.yml up -d --build
          
          # Wait for services
          echo "⏳ Waiting for backend to start..."
          sleep 15
          
          # Health check via HTTP
          for i in {1..15}; do
            if curl -f http://localhost:8000/api/health 2>/dev/null; then
              echo "✅ Backend is healthy via HTTP"
              exit 0
            fi
            sleep 2
          done
        fi
        
        echo "❌ Backend health check failed"
        docker-compose logs || docker-compose -f docker-compose.backend-only.yml logs
        exit 1
        EOF
        
        # Execute deployment
        scp -i key.pem -o StrictHostKeyChecking=no backend-deploy.tar.gz ec2-user@${{ env.EC2_HOST }}:/tmp/
        scp -i key.pem -o StrictHostKeyChecking=no deploy.sh ec2-user@${{ env.EC2_HOST }}:/tmp/
        ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} 'chmod +x /tmp/deploy.sh && /tmp/deploy.sh'
    
    - name: Final Health Check
      if: github.ref == 'refs/heads/main'
      run: |
        echo "🔍 Final health check..."
        echo "${{ secrets.EC2_PRIVATE_KEY }}" > key.pem
        chmod 600 key.pem
        
        # Test backend health (try HTTPS domain first, then fallbacks)
        echo "Testing HTTPS domain..."
        if ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} 'curl -f https://api.acadion.online/api/health 2>/dev/null'; then
          echo "✅ Backend deployment successful!"
          echo "🌐 Backend URL: https://${{ env.DOMAIN }}"
          echo "📚 API Docs: https://${{ env.DOMAIN }}/docs"
          echo "🔐 SSL: Enabled"
        elif ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} 'curl -k -f https://localhost/api/health 2>/dev/null'; then
          echo "✅ Backend deployment successful (localhost HTTPS)!"
          echo "🌐 Backend URL: https://${{ env.EC2_HOST }}"
          echo "📚 API Docs: https://${{ env.EC2_HOST }}/docs"
          echo "🔐 SSL: Self-signed"
        elif ssh -i key.pem -o StrictHostKeyChecking=no ec2-user@${{ env.EC2_HOST }} 'curl -f http://localhost:8000/api/health 2>/dev/null'; then
          echo "✅ Backend deployment successful (HTTP only)!"
          echo "🌐 Backend URL: http://${{ env.EC2_HOST }}:8000"
          echo "📚 API Docs: http://${{ env.EC2_HOST }}:8000/docs"
          echo "⚠️ SSL: Not configured"
        else
          echo "❌ Backend deployment failed"
          exit 1
        fi