<!DOCTYPE html>
<html>
<head>
    <title>Rate Limit Checker</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 15px; margin: 10px 0; border-radius: 5px; }
        .good { background: #d4edda; color: #155724; }
        .warning { background: #fff3cd; color: #856404; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🔍 Supabase Rate Limit Checker</h1>
    
    <div id="status">Checking...</div>
    
    <div class="info">
        <h3>📊 Rate Limit Info:</h3>
        <ul>
            <li><strong>Free Tier:</strong> ~30 auth requests per 5 minutes</li>
            <li><strong>Reset Time:</strong> Usually 5-15 minutes</li>
            <li><strong>Triggers:</strong> Login, logout, signup, OAuth attempts</li>
        </ul>
    </div>

    <script>
        async function checkRateLimit() {
            const statusDiv = document.getElementById('status');
            const supabaseUrl = 'https://scijpejtvneuqbhkoxuz.supabase.co';
            const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNjaWpwZWp0dm5ldXFiaGtveHV6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTU1OTcxNDEsImV4cCI6MjA3MTE3MzE0MX0.Z6Q_DmsuHYOOvCGed5hcKDrT93XPL5hHwCyGDREcmmw';
            
            try {
                // Test 1: Basic connection
                statusDiv.innerHTML = '<div class="info">Testing basic connection...</div>';
                
                const sessionResponse = await fetch(`${supabaseUrl}/auth/v1/token?grant_type=refresh_token`, {
                    method: 'POST',
                    headers: {
                        'apikey': supabaseKey,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ refresh_token: 'test' })
                });
                
                // Test 2: Check auth settings
                statusDiv.innerHTML += '<div class="info">Testing auth settings...</div>';
                
                const settingsResponse = await fetch(`${supabaseUrl}/auth/v1/settings`, {
                    headers: {
                        'apikey': supabaseKey
                    }
                });
                
                if (settingsResponse.ok) {
                    const settings = await settingsResponse.json();
                    const googleEnabled = settings.external?.google?.enabled;
                    
                    if (googleEnabled) {
                        statusDiv.innerHTML = `
                            <div class="good">
                                ✅ <strong>Rate Limit Status: GOOD</strong><br>
                                Google OAuth is enabled and working.<br>
                                You should be able to authenticate now.
                            </div>
                        `;
                    } else {
                        statusDiv.innerHTML = `
                            <div class="warning">
                                ⚠️ <strong>Rate Limit Status: LIMITED</strong><br>
                                Google OAuth appears disabled (likely due to rate limiting).<br>
                                Wait 10-15 minutes and try again.
                            </div>
                        `;
                    }
                } else if (settingsResponse.status === 429) {
                    statusDiv.innerHTML = `
                        <div class="error">
                            🚫 <strong>Rate Limit Status: EXCEEDED</strong><br>
                            HTTP 429 - Too Many Requests<br>
                            Wait 15-30 minutes before trying again.
                        </div>
                    `;
                } else {
                    statusDiv.innerHTML = `
                        <div class="warning">
                            ⚠️ <strong>Rate Limit Status: UNKNOWN</strong><br>
                            HTTP ${settingsResponse.status} - ${settingsResponse.statusText}<br>
                            May be experiencing rate limiting.
                        </div>
                    `;
                }
                
            } catch (error) {
                statusDiv.innerHTML = `
                    <div class="error">
                        ❌ <strong>Connection Error</strong><br>
                        ${error.message}<br>
                        Check your internet connection.
                    </div>
                `;
            }
        }
        
        // Check immediately and then every 2 minutes
        checkRateLimit();
        setInterval(checkRateLimit, 120000);
    </script>
</body>
</html>
