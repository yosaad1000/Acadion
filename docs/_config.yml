# GitHub Pages Configuration
title: "Acadion - AI-Powered Student Management Platform"
description: "Comprehensive student management system with facial recognition-based attendance tracking"
baseurl: ""
url: "https://yourusername.github.io/acadion"

# Theme
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Navigation
header_pages:
  - index.md
  - getting-started.md
  - api-documentation.md
  - architecture.md
  - deployment.md
  - contributing.md

# Social links
github_username: yourusername
twitter_username: yourtwitter

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/