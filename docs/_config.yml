# GitHub Pages Configuration
title: "Acadion"
description: "AI-Powered Student Management Platform with Facial Recognition"
baseurl: ""
url: "https://yosaad1000.github.io/Acadion"

# Use a better theme
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Site settings
author: "yosaad1000"
github_username: yosaad1000
repository: "yosaad1000/Acadion"

# Navigation
header_pages:
  - index.md
  - getting-started.md
  - api-documentation.md
  - architecture.md
  - deployment.md
  - contributing.md

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: true

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "default"

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md