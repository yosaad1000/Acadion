# Simple Jekyll configuration for GitHub Pages
title: "Acadion - AI-Powered Student Management Platform"
description: "Comprehensive student management system with facial recognition-based attendance tracking"
baseurl: ""
url: "https://yosaad1000.github.io/Acadion"

# Theme
remote_theme: pages-themes/minimal@v0.2.0
plugins:
  - jekyll-remote-theme

# Navigation
header_pages:
  - index.md
  - getting-started.md
  - api-documentation.md
  - architecture.md
  - deployment.md
  - contributing.md

# Social links
github_username: yosaad1000

# Build settings
markdown: kramdown
highlighter: rouge

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/