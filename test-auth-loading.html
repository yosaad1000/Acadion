<!DOCTYPE html>
<html>
<head>
    <title>Auth Loading Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .loading { color: orange; }
        .success { color: green; }
        .error { color: red; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Auth Loading Test</h1>
    <div id="status">Testing...</div>
    <div id="logs"></div>

    <script>
        let startTime = Date.now();
        let logs = [];
        
        function addLog(message, type = 'info') {
            const timestamp = ((Date.now() - startTime) / 1000).toFixed(1);
            logs.push(`[${timestamp}s] ${message}`);
            
            const logDiv = document.getElementById('logs');
            logDiv.innerHTML = logs.map(log => `<div class="log">${log}</div>`).join('');
            
            console.log(message);
        }

        function updateStatus(message, type = 'loading') {
            document.getElementById('status').innerHTML = `<span class="${type}">${message}</span>`;
        }

        // Simulate the auth loading behavior
        addLog('🔄 Starting auth test...');
        updateStatus('Loading...', 'loading');

        // Test 1: Check if loading gets stuck
        let loadingCount = 0;
        const loadingInterval = setInterval(() => {
            loadingCount++;
            addLog(`Loading check #${loadingCount}`);
            
            if (loadingCount > 20) {
                addLog('❌ Loading appears to be stuck!', 'error');
                updateStatus('FAILED: Infinite loading detected', 'error');
                clearInterval(loadingInterval);
            }
        }, 500);

        // Test 2: Simulate successful auth after 3 seconds
        setTimeout(() => {
            addLog('✅ Simulating successful auth completion');
            clearInterval(loadingInterval);
            updateStatus('SUCCESS: Auth completed normally', 'success');
        }, 3000);

        // Test 3: Safety timeout (like our AuthContext)
        setTimeout(() => {
            if (loadingCount > 15) {
                addLog('⚠️ Safety timeout triggered (like AuthContext)');
                clearInterval(loadingInterval);
                updateStatus('TIMEOUT: Loading stopped by safety mechanism', 'error');
            }
        }, 10000);

        addLog('Test setup complete. Monitoring for 10 seconds...');
    </script>
</body>
</html>
