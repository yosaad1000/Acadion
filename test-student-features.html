<!DOCTYPE html>
<html>
<head>
    <title>Student Features Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test { margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <h1>Student Features Test</h1>
    
    <div class="test">
        <h3>1. Test Authentication</h3>
        <button onclick="testAuth()">Test Auth</button>
        <div id="auth-result"></div>
    </div>
    
    <div class="test">
        <h3>2. Test Get Subjects (Student View)</h3>
        <button onclick="testGetSubjects()">Get Subjects</button>
        <div id="subjects-result"></div>
    </div>
    
    <div class="test">
        <h3>3. Test Join Class</h3>
        <input type="text" id="invite-code" placeholder="Enter invite code" />
        <button onclick="testJoinClass()">Join Class</button>
        <div id="join-result"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000';
        
        async function getToken() {
            // This would normally come from Supabase session
            return localStorage.getItem('supabase_token') || 'test-token';
        }
        
        async function testAuth() {
            const result = document.getElementById('auth-result');
            try {
                const token = await getToken();
                result.innerHTML = `Token found: ${token.substring(0, 20)}...`;
                result.className = 'success';
            } catch (error) {
                result.innerHTML = `Error: ${error.message}`;
                result.className = 'error';
            }
        }
        
        async function testGetSubjects() {
            const result = document.getElementById('subjects-result');
            try {
                const token = await getToken();
                const response = await fetch(`${API_BASE}/api/subjects`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    result.innerHTML = `Success: Found ${data.length} subjects`;
                    result.className = 'success';
                } else {
                    const error = await response.text();
                    result.innerHTML = `Error ${response.status}: ${error}`;
                    result.className = 'error';
                }
            } catch (error) {
                result.innerHTML = `Network Error: ${error.message}`;
                result.className = 'error';
            }
        }
        
        async function testJoinClass() {
            const result = document.getElementById('join-result');
            const inviteCode = document.getElementById('invite-code').value;
            
            if (!inviteCode) {
                result.innerHTML = 'Please enter an invite code';
                result.className = 'error';
                return;
            }
            
            try {
                const token = await getToken();
                const response = await fetch(`${API_BASE}/api/subjects/join`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify({ invite_code: inviteCode.toUpperCase() })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    result.innerHTML = `Success: Joined ${data.subject_name}`;
                    result.className = 'success';
                } else {
                    const error = await response.text();
                    result.innerHTML = `Error ${response.status}: ${error}`;
                    result.className = 'error';
                }
            } catch (error) {
                result.innerHTML = `Network Error: ${error.message}`;
                result.className = 'error';
            }
        }
    </script>
</body>
</html>
